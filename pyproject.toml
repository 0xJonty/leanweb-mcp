[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leanweb-mcp"
version = "0.1.0"
description = "Self-hosted web search and token-cheap page reading for small-context local LLMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonty Atkinson" }]
requires-python = ">=3.10"
# Pinned to what the pyd4vinci/scrapling:0.5.1 Docker image ships, which is what the server is tested on.
dependencies = [
    "scrapling[fetchers]==0.5.1",
    "markdownify>=1.2,<2",
    "mcp>=2.3,<3",
]
keywords = ["mcp", "llm", "web-search", "searxng", "scraping", "local-llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
leanweb-mcp = "leanweb.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: needs network access (and a SearXNG instance for search); run with: pytest -m live"]
